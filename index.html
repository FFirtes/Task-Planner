<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Планер задач</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="app-container">
        <!-- ЛЕВАЯ КОЛОНКА -->
        <main class="left-panel">
            <header>
                <h1>📋 Мои задачи</h1>
            </header>

            <!-- Планирование (дата и время) -->
            <section class="planning" aria-label="Планирование задачи">
                <div class="form-group">
                    <label for="taskDate">Дата</label>
                    <input type="date" id="taskDate" />
                </div>
                <div class="form-group">
                    <label for="startTime">Время начала</label>
                    <input type="time" id="startTime" />
                </div>
                <div class="form-group">
                    <label for="endTime">Время конца</label>
                    <input type="time" id="endTime" />
                </div>
            </section>

            <!-- Форма добавления -->
            <section class="add-task" aria-label="Добавление задачи">
                <form id="taskForm" class="task-form">
                    <label for="taskInput" class="visually-hidden">Новая задача</label>
                    <input
                        type="text"
                        id="taskInput"
                        placeholder="Поставь новую цель!"
                        required
                        autofocus
                    />
                    <button type="submit" id="addBtn">Добавить</button>
                </form>
            </section>

            <!-- Список задач -->
            <section class="task-list-section" aria-label="Список задач">
                <h2>Все задачи</h2>
                <ul id="taskList">
                    <!-- задачи динамически -->
                </ul>
            </section>

            <!-- Статистика общая -->
            <footer class="stats">
                <div class="stats-grid">
                    <span class="stat-item">
                        <span class="stat-label">Всего</span>
                        <span class="stat-value" id="totalCount">0</span>
                    </span>
                    <span class="stat-item">
                        <span class="stat-label">✅ Выполнено</span>
                        <span class="stat-value" id="completedCount">0</span>
                    </span>
                    <span class="stat-item">
                        <span class="stat-label">⏳ Не выполнено</span>
                        <span class="stat-value" id="incompleteCount">0</span>
                    </span>
                </div>
            </footer>
        </main>

        <!-- ПРАВАЯ КОЛОНКА -->
        <aside class="right-panel">
            <!-- Вкладки -->
            <div class="tabs">
                <button class="tab-btn active" data-tab="calendar">Календарь</button>
                <button class="tab-btn" data-tab="archive">Архив</button>
                <button class="tab-btn" data-tab="stats">Статистика</button>
            </div>

            <div class="tab-content">
                <!-- Календарь -->
                <div id="tab-calendar" class="tab-pane active">
                    <div class="view-switcher">
                        <button class="view-btn active" data-view="day">День</button>
                        <button class="view-btn" data-view="week">Неделя</button>
                        <button class="view-btn" data-view="month">Месяц</button>
                        <button class="view-btn" data-view="custom">Свой промежуток</button>
                    </div>
                    <div class="calendar-controls">
                        <button id="calendarPrev">◀</button>
                        <span id="calendarTitle">Сегодня</span>
                        <button id="calendarNext">▶</button>
                    </div>
                    <div id="customRangeContainer" class="custom-range" style="display:none;">
                        <label>С <input type="date" id="customStart" /></label>
                        <label>По <input type="date" id="customEnd" /></label>
                        <button id="applyCustomRange">Применить</button>
                    </div>
                    <div id="calendarView"></div>
                </div>

                <!-- Архив -->
                <div id="tab-archive" class="tab-pane">
                    <h3>Выполненные задачи</h3>
                    <ul id="archiveList"></ul>
                </div>

                <!-- Статистика -->
                <div id="tab-stats" class="tab-pane">
                    <h3>Детальная статистика</h3>
                    <div id="statsDetail"></div>
                </div>
            </div>
        </aside>
    </div>

    <script src="script.js"></script>
</body>
</html>
