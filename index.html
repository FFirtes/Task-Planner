<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="manifest" href="manifest.json" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Планер задач</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="app-container">
        <!-- ЛЕВАЯ КОЛОНКА -->
        <main class="left-panel">
            <header>
                <h1>📋 Мои задачи</h1>
            </header>

            <!-- Блок с датой, временем и кнопкой добавления -->
            <div class="today-header">
                <div class="datetime">
                    <span class="date" id="todayDate">Сегодня</span>
                    <span class="time" id="currentTime">00:00</span>
                </div>
                <button id="toggleAddModeBtn" class="add-toggle-btn" title="Добавить задачу">+</button>
            </div>

            <!-- Блок с задачами на выбранную дату (левая панель) -->
            <section class="today-tasks" id="selectedDateTasksContainer">
                <h2 id="selectedDateTitle">Задачи на сегодня</h2>
                <ul id="selectedDateTasksList">
                    <!-- задачи будут добавлены скриптом -->
                </ul>
            </section>

            <!-- Блок добавления задачи (скрыт по умолчанию) -->
            <section class="add-task hidden" id="addTaskContainer">
                <!-- Группы (остаются всегда видимыми) -->
                <div class="groups-section">
                    <h3>Группы</h3>
                    <div class="groups-list" id="groupsList">
                        <!-- Группы будут добавлены скриптом -->
                    </div>
                    <div class="group-add">
                        <input type="text" id="groupNameInput" placeholder="Название группы" />
                        <input type="color" id="groupColorInput" value="#3b82f6" class="group-color-picker" />
                        <button id="addGroupBtn" class="round-btn">+</button>
                    </div>
                </div>

                <!-- Форма добавления задачи -->
                <form id="taskForm" class="task-form">
                    <!-- Блок планирования (дата, время) -->
                    <div class="planning-form">
                        <div class="form-group">
                            <label for="taskDate">Дата</label>
                            <input type="date" id="taskDate" />
                        </div>
                        <div class="form-group">
                            <label for="startTime">Время начала</label>
                            <input type="time" id="startTime" />
                        </div>
                        <div class="form-group">
                            <label for="endTime">Время конца</label>
                            <input type="time" id="endTime" />
                        </div>
                        <div class="form-group">
                            <label for="repeatEnd">Повторять до</label>
                            <input type="date" id="repeatEnd" />
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label for="groupSelect">Группа</label>
                        <select id="groupSelect">
                            <option value="">Без группы</option>
                        </select>
                    </div>
                    <div class="form-group full-width">
                        <label for="taskInput">Текст задачи</label>
                        <input type="text" id="taskInput" placeholder="Введите задачу" required />
                    </div>
                    <div class="form-group full-width repeat-group">
                        <label>Повторение</label>
                        <div class="repeat-controls">
                            <div class="repeat-buttons" id="repeatButtons">
                                <button type="button" class="repeat-btn active" data-value="none">Нет</button>
                                <button type="button" class="repeat-btn" data-value="daily">Ежедневно</button>
                                <button type="button" class="repeat-btn day-btn" data-value="1">ПН</button>
                                <button type="button" class="repeat-btn day-btn" data-value="2">ВТ</button>
                                <button type="button" class="repeat-btn day-btn" data-value="3">СР</button>
                                <button type="button" class="repeat-btn day-btn" data-value="4">ЧТ</button>
                                <button type="button" class="repeat-btn day-btn" data-value="5">ПТ</button>
                                <button type="button" class="repeat-btn day-btn" data-value="6">СБ</button>
                                <button type="button" class="repeat-btn day-btn" data-value="0">ВС</button>
                            </div>
                        </div>
                    </div>
                    <button type="submit" id="addBtn">Добавить</button>
                </form>
            </section>
        </main>

        <!-- ПРАВАЯ КОЛОНКА -->
        <aside class="right-panel">
            <div class="tabs">
                <button class="tab-btn active" data-tab="calendar">Календарь</button>
                <button class="tab-btn" data-tab="archive">Архив</button>
                <button class="tab-btn" data-tab="stats">Статистика</button>
            </div>
            <div class="tab-content">
                <div id="tab-calendar" class="tab-pane active">
                    <div class="view-switcher">
                        <button class="view-btn active" data-view="day">День</button>
                        <button class="view-btn" data-view="week">Неделя</button>
                        <button class="view-btn" data-view="month">Месяц</button>
                        <button class="view-btn" data-view="custom">Свой промежуток</button>
                        <button class="view-btn" data-view="all">Все задачи</button>
                    </div>
                    <div class="calendar-controls" id="calendarControls">
                        <button id="calendarPrev">◀</button>
                        <span id="calendarTitle">Сегодня</span>
                        <button id="calendarNext">▶</button>
                    </div>
                    <div id="customRangeContainer" class="custom-range" style="display:none;">
                        <label>С <input type="date" id="customStart" /></label>
                        <label>По <input type="date" id="customEnd" /></label>
                        <button id="applyCustomRange">Применить</button>
                    </div>
                    <div id="calendarView"></div>
                    <!-- Блок задач на дату удалён из правой панели -->
                </div>
                <div id="tab-archive" class="tab-pane">
                    <h3>Выполненные задачи</h3>
                    <ul id="archiveList"></ul>
                </div>
                <div id="tab-stats" class="tab-pane">
                    <h3>Детальная статистика</h3>
                    <div id="statsDetail"></div>
                </div>
            </div>
        </aside>
    </div>
    <script src="script.js"></script>
</body>
</html>
